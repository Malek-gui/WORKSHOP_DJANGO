{% extends 'base.html' %}

{% block titre %}Formulaire Entreprise{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Formulaire Entreprise</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-fields">
            {{ form.as_p }}
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="{% url 'entreprises:liste' %}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
